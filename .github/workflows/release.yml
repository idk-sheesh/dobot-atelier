name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller
        run: python -m pip install -r requirements-build.txt

      - name: Executer les tests
        run: python -m unittest discover -s tests -v

      - name: Construire l'executable
        run: python -m PyInstaller --noconfirm --clean "Dobot Atelier.spec"

      - name: Assembler l'archive Windows
        run: >
          Compress-Archive -LiteralPath "dist/Dobot Atelier.exe", "README.md", "CHANGELOG.md", "docs"
          -DestinationPath "dist/Dobot-Atelier-Windows.zip"

      - name: Conserver l'archive comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dobot-Atelier-Windows
          path: dist/Dobot-Atelier-Windows.zip

      - name: Creer la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME"
          "dist/Dobot-Atelier-Windows.zip"
          --generate-notes
          --prerelease
          --title "Dobot Atelier $env:GITHUB_REF_NAME (experimental)"
          --notes "Experimental Windows build. Robot calibration, workspace and stopping behaviour are not qualified. The last recorded hardware test produced no observed motion; this fault remains unresolved. Read the setup and hardware-validation documents before use."
