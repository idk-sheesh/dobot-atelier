name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller
        run: python -m pip install pyinstaller

      - name: Executer les tests
        run: python -m unittest discover -s tests -v

      - name: Construire l'executable
        run: python -m PyInstaller --noconfirm --clean "Dobot Atelier.spec"

      - name: Conserver l'executable comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dobot-Atelier-Windows
          path: dist/Dobot Atelier.exe

      - name: Creer la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "dist/Dobot Atelier.exe"
          --generate-notes
          --title "Dobot Atelier ${{ github.ref_name }}"
